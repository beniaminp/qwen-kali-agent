model: mlx-community/Qwen3-14B-4bit
train: true
data: data/processed
fine_tune_type: lora
optimizer: adamw
num_layers: 16
batch_size: 1
iters: 600
val_batches: 25
learning_rate: 5.0e-5
steps_per_report: 10
steps_per_eval: 100
save_every: 100
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/qwen3-14b-pentest
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
lr_schedule:
  name: cosine_decay
  warmup: 80
  arguments: [5.0e-5, 600, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
