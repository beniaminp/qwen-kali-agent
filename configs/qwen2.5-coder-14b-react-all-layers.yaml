# Qwen2.5-Coder 14B — all 48 blocks, seq 2048.
# Higher capacity, higher peak memory. Run after the 24-layer config succeeds.
model: mlx-community/Qwen2.5-Coder-14B-Instruct-4bit
train: true
data: data/react/processed
fine_tune_type: lora
optimizer: adamw
num_layers: -1
batch_size: 1
iters: 250
val_batches: 25
learning_rate: 8.0e-5
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/qwen25-coder-14b-react-all
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 25
  arguments: [8.0e-5, 250, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
