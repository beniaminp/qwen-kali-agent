# Memory-constrained fallback: last 8 blocks, rank 8, alpha=32 (scale 4.0).
model: mlx-community/Qwen3-14B-4bit
train: true
data: data/processed
fine_tune_type: lora
optimizer: adamw
num_layers: 8
batch_size: 1
iters: 250
val_batches: 25
learning_rate: 1.0e-4
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 1536
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/qwen3-14b-conservative
seed: 42
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 4.0
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 250, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
