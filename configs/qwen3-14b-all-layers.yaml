# Recommended default: all 40 blocks, rank 16, standard alpha=32 parameterization.
# If this OOMs, drop num_layers to 24, then 16, before reducing max_seq_length.
model: mlx-community/Qwen3-14B-4bit
train: true
data: data/processed
fine_tune_type: lora
optimizer: adamw
num_layers: -1
batch_size: 1
iters: 300
val_batches: 25
learning_rate: 1.0e-4
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/qwen3-14b-all-layers
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 300, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
