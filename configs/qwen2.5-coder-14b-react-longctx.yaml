# Qwen2.5-Coder 14B — 4K multi-file context, last 16 blocks.
# For page + component + tests examples that exceed 3K tokens.
model: mlx-community/Qwen2.5-Coder-14B-Instruct-4bit
train: true
data: data/react/processed-long
fine_tune_type: lora
optimizer: adamw
num_layers: 16
batch_size: 1
iters: 250
val_batches: 20
learning_rate: 8.0e-5
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 4096
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/qwen25-coder-14b-react-longctx
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 25
  arguments: [8.0e-5, 250, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
