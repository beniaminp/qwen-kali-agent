model: mlx-community/Qwen3-8B-4bit
train: true
data: data/processed
fine_tune_type: lora
optimizer: adamw
num_layers: -1
batch_size: 2
iters: 300
val_batches: 25
learning_rate: 1.5e-4
steps_per_report: 10
steps_per_eval: 100
save_every: 100
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 4
mask_prompt: true
adapter_path: adapters/qwen3-8b-all-layers
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.5e-4, 300, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
