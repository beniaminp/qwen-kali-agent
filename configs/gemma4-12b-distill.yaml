# Gemma 4 12B — sequence-level distillation from a stronger teacher.
# SFT on teacher traces: Gemma 4 31B, Qwen3.8-27B or DeepSeek.
# 24 of 48 blocks, seq 2048. This is not logit KD; MLX-LM has no teacher loss.
# If this OOMs: 16/48 blocks, then max_seq_length 1024.
model: mlx-community/gemma-4-12b-it-4bit
train: true
data: data/distill/12b/processed
fine_tune_type: lora
optimizer: adamw
num_layers: 24
batch_size: 1
iters: 300
val_batches: 25
learning_rate: 8.0e-5
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/gemma4-12b-distill
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [8.0e-5, 300, 8.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
