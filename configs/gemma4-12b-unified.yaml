# Gemma 4 12B — one mixed adapter for Kali + Java + React.
# 24 of 48 blocks, seq 2048. Data: data/gemma4/unified/processed.
# Prefer separate adapters; use this only for operational simplicity.
model: mlx-community/gemma-4-12b-it-4bit
train: true
data: data/gemma4/unified/processed
fine_tune_type: lora
optimizer: adamw
num_layers: 24
batch_size: 1
iters: 300
val_batches: 25
learning_rate: 1.0e-4
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 8
mask_prompt: true
adapter_path: adapters/gemma4-12b-unified
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 300, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
