# Gemma 4 E4B — sequence-level distillation from Gemma 4 12B or 31B.
# All 42 blocks, seq 2048, batch 2, grad accum 4 = effective 8.
# E4B total weights are ~8.0B (4.5B effective) but only ~4 GB at 4-bit.
model: mlx-community/gemma-4-e4b-it-4bit
train: true
data: data/distill/e4b/processed
fine_tune_type: lora
optimizer: adamw
num_layers: -1
batch_size: 2
iters: 300
val_batches: 25
learning_rate: 1.0e-4
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 4
mask_prompt: true
adapter_path: adapters/gemma4-e4b-distill
seed: 42
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 300, 1.0e-6]
optimizer_config:
  adamw:
    weight_decay: 0.01
