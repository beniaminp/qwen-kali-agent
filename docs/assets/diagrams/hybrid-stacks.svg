<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 dense and Gemma 4 12B stacks</title>
  <desc id="desc">Qwen3-14B stacks 40 identical blocks with full grouped-query attention. Gemma 4 12B stacks 48 blocks in a repeating pattern of five local sliding-window layers and one global layer; global layers use keys as values and p-RoPE.</desc>
  <style>
    .bg { fill: #fbfaff; }
    .qwen { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; rx: 6; }
    .local { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; rx: 6; }
    .global { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
    .txt { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #1f2937; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #4b5563; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #5b21b6; }
    .mono { font-family: "JetBrains Mono", monospace; font-size: 14px; fill: #4c1d95; }
  </style>
  <rect class="bg" width="900" height="430"/>
  <text class="label" x="30" y="30">Qwen3-14B: 40 × full GQA</text>
  <text class="label" x="480" y="30">Gemma 4 12B: 48 × (5 local + 1 global)</text>

  <!-- Qwen stack -->
  <g>
    <rect class="qwen" x="40" y="60" width="300" height="34"/>
    <text class="txt" x="56" y="82">block 39 · full GQA · 40 Q / 8 KV</text>
    <rect class="qwen" x="40" y="102" width="300" height="34"/>
    <text class="txt" x="56" y="124">block 38 · full GQA · 40 Q / 8 KV</text>
    <text class="txt" x="56" y="158">…</text>
    <rect class="qwen" x="40" y="172" width="300" height="34"/>
    <text class="txt" x="56" y="194">block 1 · full GQA · 40 Q / 8 KV</text>
    <rect class="qwen" x="40" y="214" width="300" height="34"/>
    <text class="txt" x="56" y="236">block 0 · full GQA · 40 Q / 8 KV</text>
    <rect class="qwen" x="40" y="270" width="300" height="44"/>
    <text class="txt" x="56" y="290">embedding + RoPE</text>
    <text class="small" x="56" y="306">d=5120 · 40 layers · 32K train / 128K YaRN</text>
  </g>

  <!-- Gemma stack -->
  <g>
    <rect class="local" x="490" y="60" width="300" height="30"/>
    <text class="txt" x="506" y="80">local 47 · sliding window 1024</text>
    <rect class="local" x="490" y="96" width="300" height="30"/>
    <text class="txt" x="506" y="116">local 46 · sliding window 1024</text>
    <rect class="local" x="490" y="132" width="300" height="30"/>
    <text class="txt" x="506" y="152">local 45 · sliding window 1024</text>
    <rect class="local" x="490" y="168" width="300" height="30"/>
    <text class="txt" x="506" y="188">local 44 · sliding window 1024</text>
    <rect class="local" x="490" y="204" width="300" height="30"/>
    <text class="txt" x="506" y="224">local 43 · sliding window 1024</text>
    <rect class="global" x="490" y="240" width="300" height="34"/>
    <text class="txt" x="506" y="262">global 42 · K=V · p-RoPE 0.25</text>
    <text class="small" x="506" y="278">then repeat the 5:1 pattern down to block 0</text>
    <rect class="qwen" x="490" y="300" width="300" height="44"/>
    <text class="txt" x="506" y="320">embedding + SentencePiece 262k</text>
    <text class="small" x="506" y="336">d=3840 · 48 layers · 256K</text>
  </g>

  <text class="small" x="30" y="380">Local layers bound the KV cache to W=1024; global layers keep full attention every sixth block.</text>
  <text class="small" x="30" y="400">Qwen3 pays O(T²) in every layer; Gemma pays it in 1/6 of layers and O(TW) in the rest.</text>
  <text class="small" x="30" y="420">This is why a 12B model can serve 256K context while a 14B full-attention model is harder to serve.</text>
</svg>
