<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Gated DeltaNet state update</title>
  <desc id="desc">At each token, the recurrent state is decayed by alpha, corrected by the delta rule using the prediction error, and read by the query. The state has fixed size independent of sequence length.</desc>
  <style>
    .bg { fill: #fbfaff; }
    .box { fill: #ffffff; stroke: #6d28d9; stroke-width: 2; rx: 10; }
    .state { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 12; }
    .gate { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 8; }
    .arrow { stroke: #4c1d95; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .txt { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #1f2937; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #4b5563; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #5b21b6; }
    .mono { font-family: "JetBrains Mono", monospace; font-size: 15px; fill: #4c1d95; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c1d95"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="360"/>
  <text class="label" x="30" y="30">Gated DeltaNet: fixed-size associative memory</text>

  <rect class="state" x="60" y="120" width="150" height="80"/>
  <text class="txt" x="82" y="150">state S(t−1)</text>
  <text class="mono" x="82" y="172">d_k × d_v per head</text>
  <text class="small" x="82" y="190">independent of T</text>

  <path class="arrow" d="M210 160 H270"/>
  <rect class="gate" x="270" y="130" width="130" height="60"/>
  <text class="txt" x="286" y="154">decay α(t)</text>
  <text class="mono" x="286" y="174">α = exp(g), 0&lt;α&lt;1</text>

  <path class="arrow" d="M400 160 H460"/>
  <rect class="box" x="460" y="110" width="190" height="100"/>
  <text class="txt" x="476" y="136">delta correction</text>
  <text class="mono" x="476" y="158">e = v − α S k</text>
  <text class="mono" x="476" y="178">S ← α S + β e kᵀ</text>
  <text class="small" x="476" y="198">β = sigmoid(b), write rate</text>

  <path class="arrow" d="M650 160 H710"/>
  <rect class="state" x="710" y="120" width="150" height="80"/>
  <text class="txt" x="732" y="150">state S(t)</text>
  <text class="mono" x="732" y="172">read o = S q</text>
  <text class="small" x="732" y="190">next token</text>

  <text class="small" x="60" y="260">Training uses a chunkwise parallel form: the product of rank-one updates has a WY representation, so a chunk is a matmul, not a Python loop.</text>
  <text class="small" x="60" y="282">Inference is a recurrent update: O(1) state per token, no growing KV cache.</text>
  <text class="small" x="60" y="304">Qwen3.5 uses three GDN layers per one full gated-attention layer (3:1).</text>
  <text class="small" x="60" y="326">α forgets stale associations; β controls how strongly the new key/value overwrites.</text>
</svg>
